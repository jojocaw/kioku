# Render Blueprint for the public demo (free plan). Standard-library Python: nothing to install.
# Set NEBIUS_API_KEY in the Render dashboard; it is never stored in the repo.
services:
  - type: web
    name: kioku-demo
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python -m kioku.web --demo demo/seed --host 0.0.0.0 --port $PORT --daily-usd 0.3 --keep-awake https://kioku-demo.onrender.com/healthz --keep-awake-until 2026-12-15
    healthCheckPath: /healthz
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
